name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install complete test environment
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Build sample warehouse and analytical artifacts
        env:
          MPLCONFIGDIR: /tmp/matplotlib
          LOKY_MAX_CPU_COUNT: "2"
        run: |
          python scripts/build_ci_warehouse.py
          python scripts/run_revenue.py
          python scripts/run_customers.py
          python scripts/run_products.py
          python scripts/run_pricing.py
          python scripts/export_powerbi.py
      - name: Lint
        run: ruff check .
      - name: FastAPI integration tests (must execute, never skip)
        run: pytest -q tests/test_api.py --strict-markers
      - name: Complete Python tests (committed sample fixture)
        run: pytest -q
      - name: Python dependency audit
        run: python -m pip_audit --local

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Build and test dependency audit
        run: npm run audit:dev
      - name: Type-check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test
      - name: Production build
        run: npm run build
      - name: Verified static demo build
        run: npm run build:demo
      - name: Static artifact privacy and integrity check
        run: python ../scripts/check_static_artifact.py dist

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Reject tracked private or generated artifacts
        run: |
          ! git ls-files | grep -E '(^|/)(\.env|.*\.(pem|key|p12|duckdb)|online_retail_II\.xlsx|online_retail_ii\.zip|online_retail_ii_landing\.parquet)$'
          git diff --check
