[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commercial-intelligence"
version = "0.1.0"
description = "Commercial & Pricing Intelligence: revenue, customer and pricing analytics on the UCI Online Retail II dataset."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
# Runtime dependencies for M1 (ingest, clean, model). Later milestones add
# analysis/ML packages listed in SPEC.md section 3.
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.1",
    "pyarrow>=14",
    "openpyxl>=3.1",
    # M3 customer analytics
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "lifetimes>=0.11.3",   # BG/NBD + Gamma-Gamma (MIT)
    "matplotlib>=3.7",     # calibration / retention plots for the memo
    # M4 product classification
    "pydantic>=2.5",       # validated structured LLM output
    # M5 pricing & experiment design
    "statsmodels>=0.14",   # descriptive regressions + power calculation
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "pip-audit>=2.9",
    "setuptools>=68",
    "wheel>=0.45",
]
# FastAPI backend for the React frontend. Optional extra (the core pipeline and
# CI stay light). The frontend itself lives in web/ and uses npm.
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "full_data: needs the full downloaded dataset (skipped when data/raw is missing)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# B008: FastAPI's Depends()/Query() in argument defaults is the idiomatic pattern.
"api/**" = ["B008"]
